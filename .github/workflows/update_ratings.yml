name: Update Goodreads Ratings

on:
  schedule:
    - cron: "0 3 1 * *" 
  workflow_dispatch:     # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "Scrappy-bot"
          git config user.email "scrappy-bot@users.noreply.github.com"
          git add "books(full-list).json"
          git diff --cached --quiet || git commit -m "Automatic ratings update"
          git push
